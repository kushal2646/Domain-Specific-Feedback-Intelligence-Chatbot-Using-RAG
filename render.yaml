services:
  - type: web
    name: worksync-feedback-rag
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
        description: "Your Groq Cloud Console API Key"
      - key: NEON_DATABASE_URL
        sync: false
        description: "Your Neon PostgreSQL Connection String (must include pgvector support)"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
